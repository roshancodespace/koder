name: VS Code Extension CI

on:
  push:
    branches: [main, master]
    paths:
      - 'vscode-extension/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'vscode-extension/**'

jobs:
  lint-compile-test-package:
    name: Lint, Compile, Test & Package VSIX
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: 'vscode-extension/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run linter
        run: pnpm run lint

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Run headless tests
        run: xvfb-run -a pnpm test

      - name: Verify VSIX packaging
        run: npx @vscode/vsce package --no-dependencies --no-git-tag-version
