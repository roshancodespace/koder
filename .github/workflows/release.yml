name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-companion:
    name: Build Companion App (ARM64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check code formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run unit & widget tests
        run: flutter test

      - name: Build release APK (arm64 only)
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-apk
          path: companion-app/build/app/outputs/flutter-apk/*.apk
          retention-days: 1

  build-extension:
    name: Build VS Code Extension (VSIX)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'
          cache-dependency-path: 'vscode-extension/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run linter
        run: pnpm run lint

      - name: Compile TypeScript
        run: pnpm run compile

      - name: Run headless tests
        run: xvfb-run -a pnpm test

      - name: Package production VSIX
        run: npx @vscode/vsce package --no-dependencies --no-git-tag-version

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: vscode-extension/*.vsix
          retention-days: 1

  publish-release:
    name: Publish Unified GitHub Release
    needs: [build-companion, build-extension]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release assets directory
        run: mkdir -p release-assets

      - name: Download companion APK
        uses: actions/download-artifact@v4
        with:
          name: companion-apk
          path: release-assets

      - name: Download extension VSIX
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: release-assets

      - name: Calculate unified SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          echo "Generated unified SHA256 checksums:"
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

